name: generic_bloc
description: >-
  One reusable BLoC for "load something, then show it" screens: loading,
  success, empty and error states, refresh, retry and a ready-made builder
  widget.
version: 1.0.0
homepage: https://github.com/Hussein2077/generic-bloc-package
repository: https://github.com/Hussein2077/generic-bloc-package
issue_tracker: https://github.com/Hussein2077/generic-bloc-package/issues
topics:
  - bloc
  - state-management
  - clean-architecture

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  dartz: ^0.10.1
  flutter_bloc: ^8.1.6

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
